<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ventana de información con imagen</title>
  <style>
    #mapa {
      width: 100%;
      height: 600px;
    }
  </style>
</head>
<body>
	<h1>Ventana de información con imagen</h1>
	
	<div id="mapa" aria-label="Mapa con la ubicación de Casa Rural Los Tejos"></div>
	
	<script
		async
		src="https://maps.googleapis.com/maps/api/js?key=TU-CLAVE&loading=async&callback=initMap">
	</script>

  <script>

      async function initMap() {
      const { Map, InfoWindow } = await google.maps.importLibrary("maps");
      const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

      const posicion = { lat: 40.381351, lng: -5.764591 };

      const mapa = new Map(document.getElementById("mapa"), {
        center: posicion,
        zoom: 15,
        mapId: "mapa",
      });

      const marcador = new AdvancedMarkerElement({
        map: mapa,
        position: posicion,
        title: "Casa Rural Los Tejos",
        gmpClickable: true,
      });

      const contenido = document.createElement("article");
      contenido.className = "ventana-informacion";
      contenido.innerHTML = `
        <h3>Casa Rural Los Tejos</h3>
        <img
          src="casarural.jpg"
          alt="Fachada de Casa Rural Los Tejos"
          width="180"
          height="120">
        <p>Distribución:</p>
        <ul>
          <li>1 habitación de matrimonio</li>
          <li>2 habitaciones dobles</li>
          <li>2 cuartos de baño completos</li>
          <li>1 aseo</li>
          <li>Cocina</li>
        </ul>
      `;

      const ventana = new InfoWindow({
        content: contenido,
        ariaLabel: "Información de Casa Rural Los Tejos",
      });

      marcador.addEventListener("gmp-click", () => {
        ventana.open({
          map: mapa,
          anchor: marcador,
        });
      });
    }
  </script>
	
	<hr>
	<p>Artículo disponible en: <a href="http://lineadecodigo.com/google/ventanas-de-informacion-con-imagenes-en-google-maps/">http://lineadecodigo.com/google/ventanas-de-informacion-con-imagenes-en-google-maps/</a></p>
	<p><a href="http://lineadecodigo.com" title="Linea de Codigo">lineadecodigo.com</a></p>
	

</body>
</html>
